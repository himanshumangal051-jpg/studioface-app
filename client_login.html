<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Login | StudioFace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card p-10 rounded-3xl w-full max-w-md">
        <div class="text-center mb-8">
            <div class="h-14 w-14 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 border border-indigo-500/30">
                <i class="fa-solid fa-camera-retro"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Studio Client Login</h2>
            <p class="text-xs text-slate-400 mt-1">Access your workspace & media events</p>
        </div>

        {% if error %}<div class="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl mb-6 text-sm text-center">{{ error }}</div>{% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Email Address</label>
                <input type="email" name="email" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 mt-1 focus:border-indigo-500 outline-none" required>
            </div>
            <div>
                <div class="flex justify-between items-center">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
                    <a href="/client/forgot-password" class="text-xs text-indigo-400 hover:underline">Forgot Password?</a>
                </div>
                <input type="password" name="password" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 mt-1 focus:border-indigo-500 outline-none" required>
            </div>
            <button type="submit" class="w-full btn-glow text-white font-semibold py-3.5 rounded-xl mt-2">
                Access Dashboard
            </button>
        </form>
        <div class="text-center mt-6 space-y-2">
            <p class="text-xs text-slate-400">New studio owner? <a href="/client/signup" class="text-indigo-400 font-semibold hover:underline">Create Account</a></p>
            <a href="/" class="block text-xs text-slate-500 hover:text-slate-300">← Back to Gateway</a>
        </div>
    </div>
</body>
</html>
