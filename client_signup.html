<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Registration | Multi-Step Wizard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Instagram Style Top Floating Toast Notification Bar -->
    <div id="toastNotification" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform -translate-y-20 opacity-0 pointer-events-none">
        <div class="flex items-center gap-3 px-6 py-3.5 rounded-2xl shadow-2xl backdrop-blur-xl border border-slate-700/60 bg-slate-900/90 text-white text-xs font-semibold">
            <span id="toastIcon"></span>
            <span id="toastMsg">Notification message</span>
        </div>
    </div>

    <div class="glass-card p-8 md:p-10 rounded-3xl w-full max-w-xl">
        <div class="flex items-center justify-between mb-8 relative">
            <div class="w-full absolute top-1/2 -translate-y-1/2 h-1 bg-slate-800 -z-10"></div>
            <div id="step-dot-1" class="h-10 w-10 rounded-2xl bg-indigo-600 text-white font-bold flex items-center justify-center border border-indigo-400">1</div>
            <div id="step-dot-2" class="h-10 w-10 rounded-2xl bg-slate-800 text-slate-400 font-bold flex items-center justify-center border border-slate-700">2</div>
            <div id="step-dot-3" class="h-10 w-10 rounded-2xl bg-slate-800 text-slate-400 font-bold flex items-center justify-center border border-slate-700">3</div>
        </div>

        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-white" id="step-title">Step 1: Studio Details</h2>
            <p class="text-xs text-slate-400 mt-1" id="step-sub">Enter your business information</p>
        </div>

        {% if error %}<div class="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl mb-6 text-sm text-center">{{ error }}</div>{% endif %}

        <form id="multiStepForm" method="POST" action="/client/signup">
            <!-- STEP 1: Basic Studio & Address -->
            <div id="step-1" class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Studio / Business Name</label>
                    <input type="text" id="studio_name" name="studio_name" required placeholder="e.g. Imperial Visuals" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 mt-1 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Shop / Studio Full Address</label>
                    <textarea id="shop_address" name="shop_address" required rows="2" placeholder="e.g. Shop 14, City Mall, MG Road, Jaipur" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 mt-1 focus:border-indigo-500 outline-none"></textarea>
                </div>
                <button type="button" onclick="goToStep(2)" class="w-full btn-glow text-white font-semibold py-3.5 rounded-xl mt-4">
                    Next: Contact & Email OTP →
                </button>
            </div>

            <!-- STEP 2: Email OTP & Mobile Input -->
            <div id="step-2" class="space-y-5 hidden">
                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Email Address (For Verification)</label>
                    <div class="flex gap-2 mt-1">
                        <input type="email" id="email" name="email" required placeholder="owner@studio.com" class="flex-1 bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 focus:border-indigo-500 outline-none">
                        <button type="button" onclick="sendOtp()" id="btn-email-otp" class="bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 text-indigo-300 text-xs px-4 rounded-xl font-semibold flex items-center gap-1.5 transition">
                            <span id="btnText">Send OTP</span>
                        </button>
                    </div>

                    <div id="email-otp-box" class="hidden flex gap-2 mt-2">
                        <input type="text" id="email_otp" placeholder="Enter 6-digit code from email" class="flex-1 bg-slate-900 border border-slate-700 text-white rounded-xl p-2.5 text-xs outline-none tracking-widest font-mono text-center">
                        <button type="button" onclick="verifyOtp()" id="btnVerifyOtp" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 rounded-xl font-bold transition">Verify</button>
                    </div>
                    <p id="email-verified-tag" class="hidden text-xs text-emerald-400 mt-1.5 font-semibold"><i class="fa-solid fa-circle-check mr-1"></i> Email Verified Successfully</p>
                </div>

                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Studio Mobile Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="9876543210" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 mt-1 focus:border-indigo-500 outline-none">
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="goToStep(1)" class="w-1/3 bg-slate-800 text-slate-300 font-semibold py-3.5 rounded-xl">Back</button>
                    <button type="button" onclick="validateStep2()" class="w-2/3 btn-glow text-white font-semibold py-3.5 rounded-xl">
                        Next: Set Password →
                    </button>
                </div>
            </div>

            <!-- STEP 3: Passwords with Show/Hide -->
            <div id="step-3" class="space-y-4 hidden">
                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Create Password</label>
                    <div class="relative mt-1">
                        <input type="password" id="password" name="password" required placeholder="Enter strong password" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 pr-12 focus:border-indigo-500 outline-none">
                        <button type="button" onclick="togglePass('password', 'eye-1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                            <i id="eye-1" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Confirm Password</label>
                    <div class="relative mt-1">
                        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-type password" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 pr-12 focus:border-indigo-500 outline-none" oninput="checkMatch()">
                        <button type="button" onclick="togglePass('confirm_password', 'eye-2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                            <i id="eye-2" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <p id="match-status" class="text-xs mt-1.5 font-medium"></p>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="goToStep(2)" class="w-1/3 bg-slate-800 text-slate-300 font-semibold py-3.5 rounded-xl">Back</button>
                    <button type="submit" id="submitRegBtn" class="w-2/3 btn-glow text-white font-semibold py-3.5 rounded-xl">
                        Complete Registration & Launch
                    </button>
                </div>
            </div>
        </form>

        <div class="text-center mt-6">
            <p class="text-xs text-slate-400">Already registered? <a href="/client/login" class="text-indigo-400 font-semibold hover:underline">Sign In</a></p>
        </div>
    </div>

    <script>
        let isEmailVerified = false;
        let countdownTimer = null;

        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            toastIcon.innerHTML = isSuccess 
                ? '<i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>'
                : '<i class="fa-solid fa-circle-exclamation text-red-400 text-sm"></i>';

            toast.classList.remove('opacity-0', '-translate-y-20');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-20');
            }, 3500);
        }

        function goToStep(step) {
            if (step === 2) {
                if (!document.getElementById('studio_name').value.trim() || !document.getElementById('shop_address').value.trim()) {
                    showToast("Please fill Studio Name and Shop Address first.", false);
                    return;
                }
            }

            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.add('hidden');

            document.getElementById(`step-${step}`).classList.remove('hidden');

            for (let i = 1; i <= 3; i++) {
                const dot = document.getElementById(`step-dot-${i}`);
                if (i <= step) {
                    dot.className = "h-10 w-10 rounded-2xl bg-indigo-600 text-white font-bold flex items-center justify-center border border-indigo-400";
                } else {
                    dot.className = "h-10 w-10 rounded-2xl bg-slate-800 text-slate-400 font-bold flex items-center justify-center border border-slate-700";
                }
            }

            if (step === 1) {
                document.getElementById('step-title').innerText = "Step 1: Studio Details";
                document.getElementById('step-sub').innerText = "Enter your business information";
            } else if (step === 2) {
                document.getElementById('step-title').innerText = "Step 2: Contact & Verification";
                document.getElementById('step-sub').innerText = "Verify your email and add phone number";
            } else {
                document.getElementById('step-title').innerText = "Step 3: Security Setup";
                document.getElementById('step-sub').innerText = "Set strong password & confirm";
            }
        }

        async function sendOtp() {
            const emailInput = document.getElementById('email');
            const val = emailInput.value.trim();
            const btn = document.getElementById('btn-email-otp');
            const btnText = document.getElementById('btnText');

            if (!val || !val.includes('@')) { 
                showToast("Please enter a valid email address.", false);
                return; 
            }

            btn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';

            try {
                const res = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ target: val })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('email-otp-box').classList.remove('hidden');
                    showToast("✓ OTP sent successfully! Check your email inbox.", true);
                    
                    let timeLeft = 60;
                    btnText.innerText = `Resend (${timeLeft}s)`;
                    countdownTimer = setInterval(() => {
                        timeLeft--;
                        if (timeLeft <= 0) {
                            clearInterval(countdownTimer);
                            btn.disabled = false;
                            btnText.innerText = "Resend OTP";
                        } else {
                            btnText.innerText = `Resend (${timeLeft}s)`;
                        }
                    }, 1000);

                } else {
                    showToast(data.message || "Failed to send OTP.", false);
                    btn.disabled = false;
                    btnText.innerText = "Send OTP";
                }
            } catch (err) {
                showToast("Network error. Please try again.", false);
                btn.disabled = false;
                btnText.innerText = "Send OTP";
            }
        }

        async function verifyOtp() {
            const target = document.getElementById('email').value.trim();
            const otp = document.getElementById('email_otp').value.trim();
            const verifyBtn = document.getElementById('btnVerifyOtp');

            if (!otp || otp.length !== 6) {
                showToast("Please enter 6-digit OTP.", false);
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';

            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ target: target, otp: otp })
                });
                const data = await res.json();

                if (data.success) {
                    isEmailVerified = true;
                    clearInterval(countdownTimer);
                    document.getElementById('email-otp-box').classList.add('hidden');
                    document.getElementById('btn-email-otp').classList.add('hidden');
                    document.getElementById('email').readOnly = true;
                    document.getElementById('email-verified-tag').classList.remove('hidden');
                    showToast("✓ Email verified successfully!", true);
                } else {
                    showToast(data.message || "Invalid OTP code.", false);
                    verifyBtn.disabled = false;
                    verifyBtn.innerText = "Verify";
                }
            } catch (err) {
                showToast("Verification failed.", false);
                verifyBtn.disabled = false;
                verifyBtn.innerText = "Verify";
            }
        }

        function validateStep2() {
            const phone = document.getElementById('phone').value.trim();
            if (!isEmailVerified) {
                showToast("Please verify your Email OTP first.", false);
                return;
            }
            if (!phone || phone.length < 10) {
                showToast("Please enter a valid 10-digit mobile number.", false);
                return;
            }
            goToStep(3);
        }

        function togglePass(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.className = "fa-solid fa-eye-slash";
            } else {
                input.type = "password";
                icon.className = "fa-solid fa-eye";
            }
        }

        function checkMatch() {
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirm_password').value;
            const status = document.getElementById('match-status');
            const submitBtn = document.getElementById('submitRegBtn');

            if (!p2) { status.innerText = ""; return; }

            if (p1 === p2) {
                status.innerText = "✓ Passwords Match";
                status.className = "text-xs mt-1.5 font-medium text-emerald-400";
                submitBtn.disabled = false;
            } else {
                status.innerText = "✗ Passwords do not match";
                status.className = "text-xs mt-1.5 font-medium text-red-400";
                submitBtn.disabled = true;
            }
        }
    </script>
</body>
</html>
