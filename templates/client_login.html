{% extends 'base.html' %}
{% block title %}Sign in — StudioFace AI{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-card glass"><div class="eyebrow">WELCOME BACK</div><h1>Sign in to your studio</h1><p class="muted">Access events, Drive sync and your studio workspace.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}" /><div class="form-grid">
<label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
<button class="btn primary wide" type="submit">Sign in securely</button>
</div></form>
<div class="auth-foot">New studio? <a href="{{ url_for('client_signup') }}">Create an account</a></div>
</div></section>
{% endblock %}
