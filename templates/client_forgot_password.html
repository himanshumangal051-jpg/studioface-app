<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | StudioFace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Instagram Style Top Floating Toast Notification Bar -->
    <div id="toastNotification" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform -translate-y-20 opacity-0 pointer-events-none">
        <div class="flex items-center gap-3 px-6 py-3.5 rounded-2xl shadow-2xl backdrop-blur-xl border border-slate-700/60 bg-slate-900/90 text-white text-xs font-semibold">
            <span id="toastIcon"></span>
            <span id="toastMsg">Notification message</span>
        </div>
    </div>

    <div class="glass-card p-10 rounded-3xl w-full max-w-md">
        <div class="text-center mb-8">
            <div class="h-14 w-14 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 border border-indigo-500/30">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Reset Password</h2>
            <p class="text-xs text-slate-400 mt-1">Verify OTP sent to your Email to set a new password</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Registered Email</label>
                <div class="flex gap-2 mt-1">
                    <input type="email" id="reset_email" required placeholder="owner@studio.com" class="flex-1 bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 focus:border-indigo-500 outline-none">
                    <button type="button" onclick="sendResetOtp()" id="btnSendResetOtp" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 rounded-xl font-semibold flex items-center gap-1.5 transition">
                        <span id="btnResetText">Send OTP</span>
                    </button>
                </div>
            </div>

            <div id="otpSection" class="hidden">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Enter OTP from Email</label>
                <input type="text" id="reset_otp" placeholder="Enter 6-digit OTP" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 mt-1 focus:border-indigo-500 outline-none tracking-widest font-mono text-center text-lg">
            </div>

            <div id="newPassSection" class="hidden space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">New Password</label>
                    <div class="relative mt-1">
                        <input type="password" id="new_password" required placeholder="Enter new password" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 pr-12 focus:border-indigo-500 outline-none">
                        <button type="button" onclick="togglePass('new_password', 'reset-eye-1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                            <i id="reset-eye-1" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Confirm New Password</label>
                    <div class="relative mt-1">
                        <input type="password" id="confirm_new_password" required placeholder="Confirm new password" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3.5 pr-12 focus:border-indigo-500 outline-none" oninput="checkResetMatch()">
                        <button type="button" onclick="togglePass('confirm_new_password', 'reset-eye-2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                            <i id="reset-eye-2" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <p id="reset-match-status" class="text-xs mt-1 font-medium"></p>
                </div>

                <button type="button" id="btnUpdatePassword" onclick="submitPasswordReset()" class="w-full btn-glow text-white font-semibold py-3.5 rounded-xl mt-2">
                    Update Password & Login
                </button>
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="/client/login" class="text-xs text-slate-500 hover:text-slate-300">← Back to Sign In</a>
        </div>
    </div>

    <script>
        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            toastIcon.innerHTML = isSuccess 
                ? '<i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>'
                : '<i class="fa-solid fa-circle-exclamation text-red-400 text-sm"></i>';

            toast.classList.remove('opacity-0', '-translate-y-20');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-20');
            }, 3500);
        }

        async function sendResetOtp() {
            const emailInput = document.getElementById('reset_email');
            const email = emailInput.value.trim();
            const btn = document.getElementById('btnSendResetOtp');
            const btnText = document.getElementById('btnResetText');

            if (!email || !email.includes('@')) { 
                showToast("Please enter a valid email address.", false); 
                return; 
            }

            btn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';

            try {
                const res = await fetch('/api/auth/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ target: email })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('otpSection').classList.remove('hidden');
                    document.getElementById('newPassSection').classList.remove('hidden');
                    emailInput.readOnly = true;
                    btn.classList.add('hidden');
                    showToast("✓ OTP sent successfully to your email!", true);
                } else {
                    showToast(data.message || "Error sending OTP.", false);
                    btn.disabled = false;
                    btnText.innerText = "Send OTP";
                }
            } catch (err) {
                showToast("Network error. Please try again.", false);
                btn.disabled = false;
                btnText.innerText = "Send OTP";
            }
        }

        function togglePass(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.className = "fa-solid fa-eye-slash";
            } else {
                input.type = "password";
                icon.className = "fa-solid fa-eye";
            }
        }

        function checkResetMatch() {
            const p1 = document.getElementById('new_password').value;
            const p2 = document.getElementById('confirm_new_password').value;
            const status = document.getElementById('reset-match-status');
            const btn = document.getElementById('btnUpdatePassword');

            if (p1 === p2 && p1 !== '') {
                status.innerText = "✓ Passwords Match";
                status.className = "text-xs mt-1 font-medium text-emerald-400";
                btn.disabled = false;
            } else {
                status.innerText = "✗ Passwords do not match";
                status.className = "text-xs mt-1 font-medium text-red-400";
                btn.disabled = true;
            }
        }

        async function submitPasswordReset() {
            const email = document.getElementById('reset_email').value.trim();
            const otp = document.getElementById('reset_otp').value.trim();
            const new_password = document.getElementById('new_password').value;
            const updateBtn = document.getElementById('btnUpdatePassword');

            if (!otp || otp.length !== 6) {
                showToast("Please enter 6-digit OTP.", false);
                return;
            }

            updateBtn.disabled = true;
            updateBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Updating...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, otp: otp, new_password: new_password })
                });
                const data = await res.json();
                if (data.success) {
                    showToast("✓ Password updated successfully! Redirecting...", true);
                    setTimeout(() => {
                        window.location.href = "/client/login";
                    }, 1500);
                } else {
                    showToast(data.message || "Invalid OTP code.", false);
                    updateBtn.disabled = false;
                    updateBtn.innerText = "Update Password & Login";
                }
            } catch (err) {
                showToast("Failed to reset password.", false);
                updateBtn.disabled = false;
                updateBtn.innerText = "Update Password & Login";
            }
        }
    </script>
</body>
</html>
