<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ event_name }} - StudioFace AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">
  <div class="max-w-xl w-full my-8 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    <div class="text-center mb-6">
      <span class="text-indigo-400 text-xs font-semibold tracking-wider uppercase">{{ studio_name }}</span>
      <h1 class="text-3xl font-bold mt-1 text-white">{{ event_name }}</h1>
      <p class="text-slate-400 text-sm mt-1">Date: {{ event_date }}</p>
    </div>

    <!-- Step 1: Verification & Selfie -->
    <form id="guestForm" class="space-y-4" enctype="multipart/form-data">
      <div>
        <label class="block text-xs font-medium text-slate-300">Your Full Name *</label>
        <input type="text" name="guest_name" required class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-300">Phone Number *</label>
          <input type="tel" name="guest_phone" required class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300">Event PIN *</label>
          <input type="text" name="event_pin" placeholder="4-digit PIN" required class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white">
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-300">Email (Optional)</label>
        <input type="email" name="guest_email" class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white">
      </div>
      <div>
        <label class="block text-xs font-medium text-indigo-400 font-semibold">Upload Selfie for AI Face Recognition *</label>
        <input type="file" name="selfie" accept="image/*" capture="user" required class="w-full mt-1 bg-slate-800 border border-indigo-900 rounded-lg p-2 text-sm text-slate-300">
        <p class="text-[11px] text-slate-500 mt-1">Take a clear portrait photo. We only show photos where your face is matched.</p>
      </div>
      <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white transition">Find My Photos & Videos</button>
    </form>

    <!-- Step 2: Matched Gallery -->
    <div id="gallerySection" class="hidden mt-8">
      <div class="border-t border-slate-800 pt-6">
        <h2 class="text-xl font-bold text-white flex items-center justify-between">
          <span>Your Matched Memories</span>
          <span id="matchCount" class="text-xs bg-indigo-950 text-indigo-400 px-3 py-1 rounded-full border border-indigo-800"></span>
        </h2>
        <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-4"></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('guestForm');
    form.onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Analyzing Faces & Matching...";
      const res = await fetch('/api/event/{{ event_id }}/guest-access', { method: 'POST', body: new FormData(form) });
      const data = await res.json();
      btn.disabled = false;
      btn.innerText = "Find My Photos & Videos";

      if (!data.success) {
        alert(data.message);
        return;
      }

      form.classList.add('hidden');
      document.getElementById('gallerySection').classList.remove('hidden');
      document.getElementById('matchCount').innerText = `${data.matched_count} Items Found`;
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '';

      if (data.media.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-slate-500 py-6">No matching photos found with your face. Ensure your selfie was clear.</p>';
        return;
      }

      data.media.forEach(m => {
        const card = document.createElement('div');
        card.className = "bg-slate-800/80 p-2 rounded-xl border border-slate-700 flex flex-col justify-between";
        card.innerHTML = `
          <div class="h-28 bg-slate-900 rounded-lg flex items-center justify-center text-slate-400 text-xs font-mono mb-2 overflow-hidden">
            ${m.type === 'video' ? '🎬 Video Clip' : '📸 Matched Photo'}
          </div>
          <a href="${m.download_url}" download class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-500 text-center font-bold text-xs rounded-lg text-white">Download</a>
        `;
        grid.appendChild(card);
      });
    };
  </script>
</body>
</html>
